name: youtube_explode_dart
description: A port in dart of the youtube explode library. Supports several API functions without the need of Youtube API Key.
version: 3.2.0
homepage: https://github.com/Hexer10/youtube_explode_dart

topics:
  - youtube
  - video
  - streams

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  collection: ^1.18.0
  freezed_annotation: '>=2.2.0 <4.0.0'
  html: ^0.15.7
  http: ^1.0.0
  http_parser: ^4.0.0
  json_annotation: ^4.12.0
  meta: ^1.7.0
  # ^7.1.0 conflicts with flutter_svg → vector_graphics_compiler (xml <=7.0.1).
  xml: ^7.0.0
  logging: ^1.2.0
  unicode: ^1.0.0
  crypto: ^3.0.7
  path: ^1.9.1

dev_dependencies:
  build_runner: ^2.17.1
  coverage: ^1.16.0
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  lints: ^6.1.0
  source_gen: ^4.3.1
  test: ^1.33.0

false_secrets:
  - "lib/src/reverse_engineering/youtube_http_client.dart"
  - "lib/src/videos/video_controller.dart"
  - "lib/src/videos/youtube_api_client.dart"
