<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PO Token Generator</title>
</head>
<body>
<script>
// BotGuard PO Token generation script.
// Cross-origin network requests are delegated to Flutter via PoFetchChannel
// because WebView fetch() is blocked by CORS for google.com / googleapis.com.

function loadBotGuard(challengeData) {
  this.vm = this[challengeData.globalName];
  this.program = challengeData.program;
  this.vmFunctions = {};

  if (!this.vm) throw new Error('[BotGuardClient]: VM not found in global object');
  if (!this.vm.a) throw new Error('[BotGuardClient]: Could not load program');

  const vmFunctionsCallback = function(asyncSnapshotFn, shutdownFn, passEventFn, checkCameraFn) {
    this.vmFunctions = {
      asyncSnapshotFunction: asyncSnapshotFn,
      shutdownFunction: shutdownFn,
      passEventFunction: passEventFn,
      checkCameraFunction: checkCameraFn,
    };
  };

  this.vm.a(
    this.program, vmFunctionsCallback, true, this.userInteractionElement,
    function() {}, [[], []]
  );

  return new Promise(function(resolve, reject) {
    var i = 0;
    var id = setInterval(function() {
      if (this.vmFunctions.asyncSnapshotFunction) {
        resolve(this);
        clearInterval(id);
      } else if (i >= 10000) {
        reject(new Error('asyncSnapshotFunction not available after 10s'));
        clearInterval(id);
      }
      i++;
    }, 1);
  });
}

function snapshot(botguard, webPoSignalOutput) {
  return new Promise(function(resolve, reject) {
    if (!botguard.vmFunctions.asyncSnapshotFunction)
      return reject(new Error('[BotGuardClient]: Async snapshot function not found'));
    botguard.vmFunctions.asyncSnapshotFunction(
      function(response) { resolve(response); },
      [undefined, undefined, webPoSignalOutput, undefined]
    );
  });
}

function u8ToBase64(u8arr, urlSafe) {
  var bin = '';
  for (var i = 0; i < u8arr.byteLength; i++) bin += String.fromCharCode(u8arr[i]);
  var b64 = btoa(bin);
  return urlSafe ? b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '') : b64;
}

function base64ToU8(b64) {
  b64 = b64.replace(/-/g, '+').replace(/_/g, '/');
  var bin = atob(b64);
  var u8 = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}

function loadExternalScript(url) {
  return new Promise(function(resolve, reject) {
    var script = document.createElement('script');
    script.src = url;
    script.onload = function() { resolve(); };
    script.onerror = function() { reject(new Error('Failed to load script: ' + url)); };
    document.head.appendChild(script);
  });
}

var _fetchId = 0;
var _fetchWaiters = {};

function dartFetch(url, options) {
  return new Promise(function(resolve, reject) {
    var id = String(++_fetchId);
    _fetchWaiters[id] = { resolve: resolve, reject: reject };
    PoFetchChannel.postMessage(JSON.stringify({
      id: id,
      url: url,
      method: options && options.method ? options.method : 'GET',
      headers: options && options.headers ? options.headers : {},
      body: options && options.body ? options.body : null,
    }));
  });
}

function resolveDartFetch(id, success, payload) {
  var waiter = _fetchWaiters[id];
  if (!waiter) return;
  delete _fetchWaiters[id];
  if (success) {
    waiter.resolve(JSON.parse(payload));
  } else {
    waiter.reject(new Error(payload));
  }
}

async function generatePoToken(videoId, contextJson, initialAttestationDataSource, ytConfigJson) {
  try {
    var context = JSON.parse(contextJson);
    var ytConfig = JSON.parse(ytConfigJson);
    var initialAttestationData = new Function(
      'return (' + initialAttestationDataSource + ');'
    )();

    window.yt = { config_: ytConfig };

    function pickChallengeCandidate(obj) {
      if (!obj) return null;
      if (obj.bgChallenge) return obj;
      if (obj.R && obj.R.bgChallenge) return obj.R;
      if (obj.challenge && obj.challenge.bgChallenge) return obj.challenge;
      if (obj.data && obj.data.bgChallenge) return obj.data;
      return null;
    }

    var challengeData = pickChallengeCandidate(initialAttestationData);

    var interpreterUrl =
      challengeData && challengeData.bgChallenge &&
      challengeData.bgChallenge.interpreterUrl &&
      challengeData.bgChallenge.interpreterUrl.privateDoNotAccessOrElseTrustedResourceUrlWrappedValue;

    if (!interpreterUrl) {
      var attResponse = await dartFetch(
        'https://www.youtube.com/youtubei/v1/att/get?prettyPrint=false&alt=json',
        {
          method: 'POST',
          headers: {
            'Accept': '*/*',
            'Content-Type': 'application/json',
            'X-Goog-Visitor-Id': context.client.visitorData,
            'X-Youtube-Client-Version': context.client.clientVersion,
            'X-Youtube-Client-Name': '1'
          },
          body: JSON.stringify({
            engagementType: 'ENGAGEMENT_TYPE_UNBOUND',
            eacrToken: initialAttestationData.T,
            context: context
          })
        }
      );
      challengeData = pickChallengeCandidate(attResponse.body);
      if (!challengeData || !challengeData.bgChallenge) {
        throw new Error('bgChallenge not found in att/get response');
      }
      interpreterUrl =
        challengeData.bgChallenge.interpreterUrl &&
        challengeData.bgChallenge.interpreterUrl.privateDoNotAccessOrElseTrustedResourceUrlWrappedValue;
    }

    if (!interpreterUrl) throw new Error('interpreterUrl not found');
    if (interpreterUrl.startsWith('//')) interpreterUrl = 'https:' + interpreterUrl;

    // Prefer <script src> over fetch() to avoid CORS on google.com/js/*
    await loadExternalScript(interpreterUrl);

    var webPoSignalOutput = [];
    var botguard = await loadBotGuard({
      globalName: challengeData.bgChallenge.globalName,
      program: challengeData.bgChallenge.program,
    });
    var botguardResponse = await snapshot(botguard, webPoSignalOutput);

    var requestKey = 'O43z0dpjhgX20SCx4KAo';
    var itResponse = await dartFetch(
      'https://jnn-pa.googleapis.com/$rpc/google.internal.waa.v1.Waa/GenerateIT',
      {
        method: 'POST',
        headers: {
          'content-type': 'application/json+protobuf',
          'x-goog-api-key': 'AIzaSyDyT5W0Jh49F30Pqqtyfdf7pDLFKLJoAnw',
          'x-user-agent': 'grpc-web-javascript/0.1',
        },
        body: JSON.stringify([requestKey, botguardResponse]),
      }
    );

    var itData = itResponse.body;
    if (!Array.isArray(itData)) throw new Error('Could not parse integrity token response');

    var integrityToken = typeof itData[0] === 'string' && itData[0].length > 0 ? itData[0] : null;
    var websafeFallbackToken =
      typeof itData[3] === 'string' && itData[3].length > 0 ? itData[3] : null;

    var getMinter = webPoSignalOutput[0];
    if (!getMinter) {
      if (websafeFallbackToken) {
        PoTokenChannel.postMessage(JSON.stringify({ success: true, token: websafeFallbackToken }));
        return;
      }
      throw new Error('PMD:Undefined');
    }

    var tokenMaterial = integrityToken || websafeFallbackToken;
    if (!tokenMaterial) throw new Error('Could not get integrity token');

    var mintCallback = await getMinter(base64ToU8(tokenMaterial));
    if (typeof mintCallback !== 'function') throw new Error('APF:Failed');
    var result = await mintCallback(new TextEncoder().encode(videoId));
    if (!result || !(result instanceof Uint8Array)) throw new Error('ODM:Invalid');

    var poToken = u8ToBase64(result, true);
    PoTokenChannel.postMessage(JSON.stringify({ success: true, token: poToken }));
  } catch (e) {
    PoTokenChannel.postMessage(JSON.stringify({ success: false, error: e.message || String(e) }));
  }
}
</script>
</body>
</html>
